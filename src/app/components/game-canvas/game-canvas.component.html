<div id="game">
    <div class="container" id="container">
        <canvas id="gameCanvas"></canvas>

        <table class="stats" id="stats"></table>
        <div class="game-bar" id="game-bar"></div>

        <div class="controls" id="controls">
            <input class="range" type="range" id="progressBar" value="0" max="100">
                <div class="controls-bottom">
                    <div class="controls-left">
                        <button class=".play-button control-button" id="playPauseBtn">⏸️</button>
                        <p class="time-stamp" id="timeStamp">0/0</p>
                    </div>
                    <div class="controls-right">
                        <button class="control-button" id="clearDebugging">Clear debugging</button>
                        <div class="custom-select">
                            <label for="speedSelect" class="speedLabel">Speed:</label>
                            <select class="control-button" id="speedSelect">
                                <option value="0.25">0.25</option>
                                <option value="0.5">0.5</option>
                                <option value="0.75">0.75</option>
                                <option value="1" selected>1</option>
                                <option value="1.25">1.25</option>
                                <option value="1.5">1.5</option>
                                <option value="2">2</option>
                            </select>
                        </div>
                        <button class="control-button fullscreen-button" id="fullscreen">⌞    ⌝</button>
                    </div>
            </div>
        </div>
    </div>
</div>
